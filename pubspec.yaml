name: proxy_video
description: >-
  A range-capable HTTP proxy that caches media on disk in fixed-size chunks, so
  a player can start watching before the whole object has been transferred.
version: 0.2.0
publish_to: none

environment:
  # 3.8 keeps the tall-style formatter on, which adds trailing commas for us
  # and lets `require_trailing_commas` stay enforceable.
  sdk: ^3.8.0

dependencies:
  # Cross-platform path joining/normalisation (Windows-safe).
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.1
